# Every setting can also be overridden with the matching QUARKUS_... environment variable.

quarkus.application.name=greenleaf-pharmacy

quarkus.http.port=${PORT:8080}

# PostgreSQL: the docker compose service when running locally (`docker compose up -d postgres`).
# Tests get a throwaway database of their own from Quarkus Dev Services (needs Docker).
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/pharmacy}
%dev,prod.quarkus.datasource.username=${DATABASE_USER:pharmacy}
%dev,prod.quarkus.datasource.password=${DATABASE_PASSWORD:pharmacy}
quarkus.flyway.migrate-at-start=true
# Tests start every case from a freshly migrated database.
%test.quarkus.flyway.clean-disabled=false
# Wait for the database at startup (up to about 5 minutes) instead of failing at once: after a full restart the app may
# come up before PostgreSQL does.
quarkus.flyway.connect-retries=60
quarkus.flyway.connect-retries-interval=5S

# Nothing that touches the database may hang. A dead connection, a stuck lock or a runaway query fails within seconds,
# and the request answers 503 (see persistence/Transactions) instead of holding a thread and a pooled connection.
# In seconds: give up connecting after 3 and logging in after 5 (a hung server, or a proxy in front of one, accepts the
# connection and then says nothing); a reply that takes 15 means the connection is dead, since no statement may run
# longer than 10 (TCP keepalive also notices dead peers).
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=15
quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true
# On the server: no statement over 10s (migrations included: split long ones), no lock wait over 5s (check-ins queue on
# the ticket counter row), no transaction left idle over 60s.
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=10s -c lock_timeout=5s -c idle_in_transaction_session_timeout=60s
# The pool: wait at most 5s for a connection; check a connection that sat idle for 10s before handing it out (after a
# database restart, idle ones are all dead), giving the check 2s; retire connections after 30 minutes; warn about any
# held for over a minute.
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.foreground-validation-interval=10S
quarkus.datasource.jdbc.validation-query-timeout=2S
quarkus.datasource.jdbc.background-validation-interval=30S
quarkus.datasource.jdbc.max-lifetime=30M
quarkus.datasource.jdbc.leak-detection-interval=1M
# Longer than any statement may run; rolls back anything stuck well before idle_in_transaction_session_timeout.
quarkus.transaction-manager.default-transaction-timeout=30s

# RabbitMQ. Tests run without a broker, like an instance whose broker is down: events stay in the outbox.
pharmacy.rabbitmq.uri=${RABBITMQ_URI:amqp://pharmacy:pharmacy@localhost:5672}
pharmacy.rabbitmq.enabled=true
%test.pharmacy.rabbitmq.enabled=false

# The stock check sweeper runs, from the database, the stock checks whose message is late, lost or parked (e.g. while
# RabbitMQ is down). Patients see "taking longer than usual" after 30s, so it acts well before that. Tests run it by hand.
pharmacy.stock-check.sweeper.enabled=true
pharmacy.stock-check.sweeper.every=10s
pharmacy.stock-check.sweeper.after=15s
%test.pharmacy.stock-check.sweeper.enabled=false
%test.pharmacy.stock-check.sweeper.after=0s

# Live screens re-read the database this often even without events, in case one was lost.
pharmacy.live-updates.refresh-every=10s
# At most this many live screen queries at once, so the screens never take all the database connections.
pharmacy.live-updates.max-concurrent-queries=4

# The web app runs on an origin of its own (web/, `npm run dev` or `npm run preview` locally), so the API allows it
# cross-origin requests. A comma-separated list.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${WEB_ORIGINS:http://localhost:5173,http://localhost:4173}
# A page may read only a few response headers of another origin unless told otherwise. The web app reads Retry-After, to
# wait as long as a 503 asks before it tries again.
quarkus.http.cors.exposed-headers=Retry-After

# Logging. The app's own categories start with "pharmacy" (pharmacy.domain: the business events, by ticket number,
# never patient names; pharmacy.infra: requests, the database, RabbitMQ). DEBUG adds every live stream, published
# batch and broker check; TRACE every request and database call.
quarkus.log.category."pharmacy".level=INFO
%dev.quarkus.log.category."pharmacy".level=DEBUG
quarkus.log.category."com.rabbitmq".level=WARN
# jOOQ's logo and tip of the day at startup.
quarkus.log.category."org.jooq.Constants".level=WARN

# Observability (docker compose runs Prometheus, Loki, Alloy and Grafana: see observability/).
#
# Logs: next to the console, a JSON file with one line per record, which Alloy ships to Loki. Every line says what it is
# about, "business" (pharmacy.domain: what happened to prescriptions and stock) or "system" (everything else): the
# log_type field under "mdc", set by logging/LogTypeFilter. In dev mode the working directory is the repository root.
# The console stays as it was: the JSON extension would otherwise make it JSON too, outside dev mode.
quarkus.log.console.json.enabled=false
quarkus.log.file.enabled=true
%test.quarkus.log.file.enabled=false
quarkus.log.file.path=${LOG_FILE:logs/pharmacy.log}
quarkus.log.file.filter=log-type
quarkus.log.file.json.enabled=true
# The stack trace as one string, which is how Alloy appends it to the message.
quarkus.log.file.json.exception-output-type=formatted
quarkus.log.file.rotation.max-file-size=20M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=false

# Metrics, at /q/metrics for Prometheus: JVM, HTTP requests (latency buckets in metrics/MeterConfiguration), the
# connection pool, and the app's own business and system metrics (metrics/). The ones that need the database are read in
# the background, so a scrape never waits for it. Tests refresh them by hand.
quarkus.datasource.metrics.enabled=true
pharmacy.metrics.refresh.enabled=true
pharmacy.metrics.refresh.every=10s
%test.pharmacy.metrics.refresh.enabled=false
# Prometheus runs in docker compose and scrapes the backend on the host as host.docker.internal:8080 (see
# observability/prometheus/prometheus.yml). In dev mode Quarkus answers 400 to any other Host header than localhost, so
# without this the pharmacy-api target is down and the Grafana cards fed by the pharmacy_* metrics show no data.
%dev.quarkus.http.host-validation.allowed-hosts=localhost,host.docker.internal

# The government prescription system (gov-api/ is a mock of it: `make gov-api`). A patient who checks in with a government
# prescription number has it looked up while they wait, so the timeout is short. What they take is committed to it after
# the hand-over, from the outbox: the relay tries every few seconds, backs off while the government is unavailable, and
# never loses a commit. Tests run the relay by hand, against a fake government system served by the app itself (see
# FakeGovernmentApi).
pharmacy.government-api.url=${GOVERNMENT_API_URL:http://localhost:4000}
pharmacy.government-api.timeout=5s
%test.pharmacy.government-api.url=http://localhost:${quarkus.http.test-port:8081}/fake-government
%test.pharmacy.government-api.timeout=1s
pharmacy.government-commits.relay.enabled=true
pharmacy.government-commits.relay.every=2s
%test.pharmacy.government-commits.relay.enabled=false
