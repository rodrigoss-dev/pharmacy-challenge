server {
    listen 80;
    root /usr/share/nginx/html;

    # Built assets have a content hash in their name, so browsers may keep them forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every page path (/, /board, /staff, /track/{id}...) gets the single-page app's shell, and its router takes it
    # from there. The shell must be revalidated, or a deploy would leave browsers on the old app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /200.html;
    }
}
